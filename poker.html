<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
/*
 * Relay MQTT (basat en peer-mqtt-shim.js).
 * Substitueix PeerJS i fa anar les partides per brokers MQTT públics,
 * de manera que funciona entre xarxes diferents sense TURN/NAT.
 * Si mqtt.js no es pot carregar, es queda PeerJS com a reserva.
 */
(function () {
    'use strict';
    if (!window.mqtt) { console.warn('[shim] mqtt.js no s\'ha carregat; es farà servir PeerJS.'); return; }

    const BROKERS = [
        'wss://broker.emqx.io:8084/mqtt',
        'wss://broker.hivemq.com:8884/mqtt',
        'wss://test.mosquitto.org:8081'
    ];
    const T = 'culopr/v1/';
    const rnd = () => Math.random().toString(36).slice(2, 10);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    class Emitter {
        constructor() { this._h = {}; }
        on(e, f) { (this._h[e] = this._h[e] || []).push(f); return this; }
        emit(e, ...a) { (this._h[e] || []).slice().forEach((f) => { try { f(...a); } catch (x) { console.error(x); } }); }
    }

    class Conn extends Emitter {
        constructor(peer, remote, cid, client) {
            super();
            this.peer = peer; this.peerId = remote; this.cid = cid; this.client = client;
            this.open = false; this.closed = false;
        }
        send(m) {
            if (!this.open || this.closed) return;
            this.peer._pub(this.client, this.peerId, { k: 'data', cid: this.cid, d: m });
        }
        close() {
            if (this.closed) return;
            if (this.client) this.peer._pub(this.client, this.peerId, { k: 'close', cid: this.cid });
            this._end();
        }
        _opened() { if (this.open || this.closed) return; this.open = true; this.emit('open'); }
        _end() {
            if (this.closed) return;
            this.closed = true; this.open = false;
            delete this.peer._conns[this.cid];
            this.emit('close');
        }
    }

    class Peer extends Emitter {
        constructor(id) {
            super();
            this.requested = typeof id === 'string' && !!id;
            this.id = this.requested ? id : 'g' + rnd();
            this.open = false; this.destroyed = false;
            this._conns = {}; this._clients = {}; this._primary = -1;
            this._announced = !this.requested;
            this._init();
        }

        _inbox(id) { return T + 'i/' + id; }
        _pres(id) { return T + 'p/' + id; }
        _pub(client, toId, obj) { try { client.publish(this._inbox(toId), JSON.stringify(obj)); } catch (e) { /* ignora */ } }
        _announce(c) { try { c.publish(this._pres(this.id), 'online', { retain: true }); } catch (e) { /* ignora */ } }

        _client(j) {
            if (this._clients[j]) return this._clients[j];
            const p = new Promise((resolve, reject) => {
                let settled = false;
                const c = window.mqtt.connect(BROKERS[j], {
                    clientId: 'culopr_' + rnd() + rnd(),
                    clean: true, keepalive: 20, connectTimeout: 6000, reconnectPeriod: 2000,
                    will: { topic: this._pres(this.id), payload: 'offline', retain: true, qos: 0 }
                });
                c._pl = {};
                const to = setTimeout(() => {
                    if (!settled) { settled = true; try { c.end(true); } catch (e) { /* ignora */ } reject(new Error('timeout ' + BROKERS[j])); }
                }, 7000);
                c.on('connect', () => {
                    c.subscribe(this._inbox(this.id));
                    if (this._announced) this._announce(c);
                    if (!settled) { settled = true; clearTimeout(to); resolve(c); }
                });
                c.on('error', () => { /* mqtt.js reintenta sol */ });
                c.on('message', (topic, payload) => this._onMsg(c, topic, payload.toString()));
            });
            p.catch(() => { delete this._clients[j]; });
            this._clients[j] = p;
            return p;
        }

        _probe(c, id, ms) {
            return new Promise((resolve) => {
                const t = this._pres(id);
                let done = false;
                const finish = (v) => {
                    if (done) return;
                    done = true; clearTimeout(to);
                    c._pl[t] = (c._pl[t] || []).filter((x) => x !== f);
                    resolve(v);
                };
                const f = (s) => finish(s === 'online');
                const to = setTimeout(() => finish(false), ms);
                (c._pl[t] = c._pl[t] || []).push(f);
                c.subscribe(t);
            });
        }

        _watch(c, conn) {
            const t = this._pres(conn.peerId);
            (c._pl[t] = c._pl[t] || []).push((s) => { if (s === 'offline') conn._end(); });
            c.subscribe(t);
        }

        _onMsg(c, topic, s) {
            if (this.destroyed) return;
            if (topic.indexOf(T + 'p/') === 0) { (c._pl[topic] || []).slice().forEach((f) => f(s)); return; }
            let m; try { m = JSON.parse(s); } catch (e) { return; }
            if (!m) return;
            if (m.k === 'conn') {
                if (!this.open || this._conns[m.cid]) return;
                const conn = new Conn(this, m.from, m.cid, c);
                this._conns[m.cid] = conn;
                this._watch(c, conn);
                this._pub(c, m.from, { k: 'acc', cid: m.cid });
                this.emit('connection', conn);
                setTimeout(() => conn._opened(), 0);
                return;
            }
            const conn = this._conns[m.cid];
            if (!conn) return;
            if (m.k === 'acc') { if (conn._acc) conn._acc(true); conn._opened(); }
            else if (m.k === 'data') conn.emit('data', m.d);
            else if (m.k === 'close') conn._end();
        }

        async _init() {
            let c = null, j0 = -1;
            for (let j = 0; j < BROKERS.length; j++) {
                try { c = await this._client(j); j0 = j; break; } catch (e) { /* prova el següent */ }
            }
            if (this.destroyed) return;
            if (!c) { this.emit('error', { type: 'network', message: 'No es pot connectar a cap servidor MQTT' }); return; }
            this._primary = j0;
            if (this.requested && await this._probe(c, this.id, 1200)) {
                this.emit('error', { type: 'unavailable-id', message: 'ID ocupat' });
                return;
            }
            this._announced = true;
            this._announce(c);
            this.open = true;
            this.emit('open', this.id);
        }

        connect(targetId) {
            const conn = new Conn(this, targetId, rnd() + rnd(), null);
            this._conns[conn.cid] = conn;
            this._dial(conn);
            return conn;
        }

        async _dial(conn) {
            for (let n = 0; n < 100 && !this.open && !this.destroyed; n++) await sleep(50);
            const order = [];
            if (this._primary >= 0) order.push(this._primary);
            for (let j = 0; j < BROKERS.length; j++) if (order.indexOf(j) < 0) order.push(j);
            for (const j of order) {
                let c; try { c = await this._client(j); } catch (e) { continue; }
                if (this.destroyed || conn.closed) return;
                if (!(await this._probe(c, conn.peerId, 2500))) continue;
                conn.client = c;
                this._watch(c, conn);
                const ok = await new Promise((res) => {
                    conn._acc = res;
                    this._pub(c, conn.peerId, { k: 'conn', cid: conn.cid, from: this.id });
                    setTimeout(() => res(false), 6000);
                });
                if (ok) return;
            }
            if (!conn.closed && !this.destroyed) {
                conn.emit('error', { type: 'peer-unavailable' });
                this.emit('error', { type: 'peer-unavailable', message: 'Sala no trobada' });
            }
        }

        reconnect() { /* mqtt.js es reconnecta automàticament */ }

        destroy() {
            if (this.destroyed) return;
            this.destroyed = true; this.open = false;
            Object.keys(this._conns).forEach((k) => this._conns[k].close());
            Object.keys(this._clients).forEach((j) => {
                this._clients[j].then((c) => {
                    try { c.publish(this._pres(this.id), 'offline', { retain: true }); } catch (e) { /* ignora */ }
                    setTimeout(() => { try { c.end(); } catch (e) { /* ignora */ } }, 200);
                }).catch(() => { });
            });
            this.emit('close');
        }
    }

    window.__CULO_TRANSPORT = 'mqtt';
    window.Peer = Peer;
})();
</script>

<script>
'use strict';
/* ============ SETUP ============ */
const SUITS=['♠','♥','♦','♣'];
const RANKS=['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
const HAND_NAMES=['High Card','One Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush'];
const SB=10,BB=20,START_CHIPS=1000;
const NAMES=['You','Pau','Martí','Júlia','Nil','Laia'];
const SEAT_POS=[{x:50,y:97},{x:9,y:76},{x:4,y:38},{x:26,y:7},{x:74,y:7},{x:96,y:38}];
let players=[],deck=[],community=[],pot=0,currentBet=0,minRaise=BB,buttonIdx=0,phase='IDLE',handInProgress=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ DECK & EVALUATOR ============ */
function newDeck(){
 const d=[];
 for(const s of SUITS)for(const r of RANKS)d.push({r,s});
 for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
 return d;
}
function eval5(cards){
 const ranks=cards.map(c=>RANKS.indexOf(c.r)).sort((a,b)=>b-a);
 const suits=cards.map(c=>c.s);
 const flush=suits.every(s=>s===suits[0]);
 const uniq=[...new Set(ranks)];
 let straightHigh=-1;
 if(uniq.length===5){
  if(uniq[0]-uniq[4]===4)straightHigh=uniq[0];
  else if(uniq[0]===12&&uniq[1]===3)straightHigh=3; // wheel A-5
 }
 const cnt={};ranks.forEach(r=>cnt[r]=(cnt[r]||0)+1);
 const groups=Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a]||b-a);
 if(flush&&straightHigh>=0)return[8,straightHigh];
 if(cnt[groups[0]]===4)return[7,groups[0],groups[1]];
 if(cnt[groups[0]]===3&&cnt[groups[1]]===2)return[6,groups[0],groups[1]];
 if(flush)return[5,...ranks];
 if(straightHigh>=0)return[4,straightHigh];
 if(cnt[groups[0]]===3)return[3,groups[0],groups[1],groups[2]];
 if(cnt[groups[0]]===2&&cnt[groups[1]]===2)return[2,Math.max(groups[0],groups[1]),Math.min(groups[0],groups[1]),groups[2]];
 if(cnt[groups[0]]===2)return[1,groups[0],...ranks.filter(r=>r!==groups[0])];
 return[0,...ranks];
}
function bestOf7(cards){
 if(cards.length===5)return eval5(cards);
 let best=null;
 const idx=[];
 (function pick(start){
  if(idx.length===5){
   const v=eval5(idx.map(i=>cards[i]));
   if(!best||cmpHands(v,best)>0)best=v;
   return;
  }
  for(let i=start;i<=cards.length-(5-idx.length);i++){idx.push(i);pick(i+1);idx.pop()}
 })(0);
 return best;
}
function cmpHands(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const x=a[i]??-1,y=b[i]??-1;if(x!==y)return x-y}return 0}
function describe(h){return HAND_NAMES[h[0]]+(h[0]>0&&h[0]!==5&&h[0]!==4?' · '+RANKS[h[1]]:'')}

/* ============ AI ============ */
function preflopStrength(cards){
 const a=RANKS.indexOf(cards[0].r),b=RANKS.indexOf(cards[1].r);
 const hi=Math.max(a,b),lo=Math.min(a,b);
 let sc=hi/24+lo/40;
 if(a===b)sc=.55+a*.035;
 if(cards[0].s===cards[1].s)sc+=.05;
 if(hi-lo===1)sc+=.045;
 if(hi-lo>4)sc-=.05;
 return Math.max(0,Math.min(1,sc));
}
function aiStrength(p){
 if(phase==='PREFLOP')return preflopStrength(p.cards);
 const cards=p.cards.concat(community);
 return Math.min(1,bestOf7(cards)[0]/8+bestOf7(cards)[1]/60);
}
function aiMove(p){
 const toCall=Math.min(currentBet-p.bet,p.chips);
 const potAfter=pot+toCall;
 const st=aiStrength(p),rand=Math.random();
 const maxTotal=p.bet+p.chips;
 if(currentBet===p.bet){
  if(st>0.72&&rand<.65)return{type:'bet',amount:Math.min(maxTotal,Math.max(BB,Math.round(pot*.75/5)*5))};
  if(rand<.1)return{type:'bet',amount:Math.min(maxTotal,Math.max(BB,Math.round(pot*.6/5)*5))};
  return{type:'check'};
 }
 const potOdds=toCall/Math.max(1,potAfter);
 if(st>0.88&&rand<.5&&p.chips>toCall+minRaise)return{type:'raise',amount:Math.min(maxTotal,currentBet+Math.max(minRaise,Math.round(pot*.8/5)*5))};
 if(st>potOdds+.28||(st>.42&&toCall<=BB*2))return{type:'call'};
 if(rand<.07&&p.chips>toCall+minRaise)return{type:'raise',amount:Math.min(maxTotal,currentBet+minRaise)};
 return{type:'fold'};
}

/* ============ GAME FLOW ============ */
function initPlayers(){
 players=NAMES.map((name,i)=>({id:'local_'+i,name,isHuman:i===0,chips:START_CHIPS,cards:[],folded:false,allIn:false,bet:0,busted:false,winner:false}));
 buttonIdx=players.length-1;
 window.__MYID=players[0].id;
}
const activeIdx=()=>players.map((p,i)=>i).filter(i=>!pFolded(i)&&!players[i].busted);

let currentActor=-1;
async function bettingRound(firstActor){
 const pending=new Set(activeIdx().filter(i=>!players[i].allIn));
 let actor=firstActor;
 while(pending.size){
  const p=players[actor];
  if(p.busted||p.folded||p.allIn||!pending.has(actor)){actor=(actor+1)%players.length;continue}
  currentActor=actor;renderSeats();
  const move=p.isHuman?await humanMove(p):aiMove(p);
  await sleep(p.isHuman?150:650);
  const raised=applyMove(actor,move,pending);
  updateUI();
  if(activeIdx().length===1){return'folded'}
  if(raised&&players.filter(q=>!q.folded&&!q.busted&&!q.allIn).length===0)break;
  actor=(actor+1)%players.length;
 }
 currentActor=-1;
 return'ok';
}
function applyMove(i,move,pending){
 const p=players[i];
 if(move.type==='fold'){p.folded=true;log(`${esc(p.name)} folds`);pending.delete(i);return false}
 if(move.type==='check'){log(`${esc(p.name)} checks`);pending.delete(i);return false}
 if(move.type==='call'){
  const amt=Math.min(currentBet-p.bet,p.chips);
  p.chips-=amt;p.bet+=amt;pot+=amt;
  if(p.chips===0){p.allIn=true;log(`${esc(p.name)} calls ${amt} (all-in!)`)}
  else log(`${esc(p.name)} calls ${amt}`);
  pending.delete(i);return false;
 }
 // bet or raise
 let target=move.amount;
 const prevBet=currentBet;
 let isFullRaise=true;
 if(move.type==='bet'){
  target=Math.max(target,BB);
  currentBet=p.bet+target;minRaise=currentBet-p.bet;
  log(`${esc(p.name)} bets ${currentBet-p.bet}`);
 }else{
  target=Math.max(target,currentBet+minRaise);
  currentBet=target;minRaise=currentBet-prevBet;
  log(`${esc(p.name)} raises to ${currentBet}`);
 }
 const need=target-p.bet;
 const add=Math.min(need,p.chips);
 p.chips-=add;p.bet+=add;pot+=add;
 if(p.chips===0){
  p.allIn=true;
  if(p.bet<target){ // short all-in: not a full raise, does not reopen betting
   isFullRaise=false;
   currentBet=Math.max(prevBet,p.bet);
   minRaise=Math.min(minRaise,Math.max(BB,currentBet-prevBet));
   log(`${esc(p.name)} is all-in (short stack, ${p.bet} total)`);
  }
 }
 if(isFullRaise)activeIdx().forEach(j=>{if(j!==i&&!players[j].allIn)pending.add(j)});
 pending.delete(i);
 return isFullRaise;
}

 });
}

 phase='RIVER';community.push(deck.pop());log('🂡 River: '+community[4].r+community[4].s);updateUI();await sleep(700);
 if(await bettingRound((buttonIdx+1)%players.length)==='folded')return endByFold();
 return showdown();
}

  }
  if(m.t==='pk'&&humanWait&&humanWait.id===pid){const mv=humanWait.res;humanWait=null;mv({type:m.a,amount:m.amount})}

 async function hostBettingRound(firstActor){

 /* ---------- CLIENT ---------- */

  if(d.seq<=lastSeq)return;lastSeq=d.seq;
  players=d.seats;community=d.community;pot=d.pot;currentBet=d.currentBet;minRaise=d.minRaise;
  buttonIdx=d.button;phase=d.phase;currentActor=d.actor;showHoleOverride=d.revealed;handInProgress=true;
  HLOG=d.log;renderHLog();updateUI();
  wireClientTurn(d);
 }
 function wireClientTurn(d){
  const myIdx=players.findIndex(p=>p.id===window.__MYID);
  const me=players[myIdx];
  myTurnNonce++;
  const btns=['btn-fold','btn-call','btn-raise','btn-half','btn-pot','btn-allin'];
  const disableAll=()=>{btns.forEach(id=>$(id).disabled=true);$('raise-slider').disabled=true};
  if(d.revealed||myIdx<0||me.busted||me.folded||me.allIn||!me.cards.length||d.actor!==myIdx){disableAll();return}
  const p=me,toCall=Math.min(currentBet-p.bet,p.chips),maxTotal=p.bet+p.chips;
  const canRaise=p.chips>toCall;
  const callBtn=$('btn-call'),raiseBtn=$('btn-raise'),slider=$('raise-slider');
  const nonce=myTurnNonce;
  callBtn.textContent=toCall===0?'CHECK':'CALL '+toCall;
  callBtn.disabled=false;
  $('btn-fold').disabled=toCall===0;
  slider.min=currentBet===0?BB:currentBet+minRaise;slider.max=maxTotal;slider.value=slider.min;slider.disabled=!canRaise;
  raiseBtn.disabled=!canRaise;
  const updLab=()=>{const v=+slider.value;$('raise-val').textContent=v;raiseBtn.textContent=(currentBet===0?'BET ':'RAISE TO ')+v};
  slider.oninput=updLab;updLab();
  const send=a=>{if(nonce!==myTurnNonce)return;disableAll();net.send(a)};
  callBtn.onclick=()=>send({t:'pk',a:toCall===0?'check':'call'});
  $('btn-fold').onclick=()=>send({t:'pk',a:'fold'});
  raiseBtn.onclick=()=>send({t:'pk',a:currentBet===0?'bet':'raise',amount:+slider.value});
  const setSlider=v=>{slider.value=Math.min(maxTotal,Math.max(slider.min,v));updLab()};
  $('btn-half').onclick=()=>setSlider(currentBet===0?Math.round(pot/2):currentBet+Math.round(pot/2));
  $('btn-pot').onclick=()=>setSlider(currentBet===0?pot:currentBet+pot);
  $('btn-allin').onclick=()=>setSlider(maxTotal);
  $('hand-strength-tip').textContent=phase==='PREFLOP'?'Hole cards dealt. Good luck!':'Your best hand: '+(community.length?describe(bestOf7(p.cards.concat(community))):'—');
 }
 async function clientBoot(){
  net.onHostLost=()=>{alert('Connection with the host was lost.');location.href='index.html'};
  net.sub(clientApply);
  const first=await net.join();
  if(!first){showOverlay('Table not found. Check the code with the host.','Back to Menu');$('btn-overlay').onclick=()=>location.href='index.html';return}
  clientApply(first);
 }
 /* rebuy button (client, both roles) */
 const rebuy=document.createElement('button');
 rebuy.className='pbtn small';rebuy.id='btn-rebuy';rebuy.textContent='🪙 REBUY 1000';rebuy.style.display='none';
 $('bet-bar').appendChild(rebuy);
 rebuy.onclick=()=>{if(window.__IS_HOST){const s=players.find(p=>p.id===window.__MYID);if(s&&s.busted){s.busted=false;s.chips=START_CHIPS;hlog(`🪙 <b>${esc(s.name)}</b> rebuys for ${START_CHIPS}.`);bcast();updateUI()}}else net.send({t:'pk',a:'rebuy'})};
 setInterval(()=>{
  if(!window.__ONLINE)return;
  const me=players.find(p=>p.id===window.__MYID);
  rebuy.style.display=(me&&me.busted)?'':'none';
 },800);

 window.__IS_HOST=QP.get('host')==='1';
 log(`Connecting to table <b>${QP_ROOM}</b>…`);
 if(window.__IS_HOST)hostBoot();else clientBoot();
}else{
 initPlayers();
 log('Welcome to <b>Joker Poker</b>! The Joker P deals. Blinds '+SB+'/'+BB+', everyone starts with '+START_CHIPS+' chips.');
 newHand();
}
