<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joker Blackjack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at 50% 25%,#14532d 0%,#052e16 55%,#02150b 100%);min-height:100vh;color:#e2e8f0;overflow-x:hidden}
#topbar{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto;padding:12px 16px 0;gap:8px;flex-wrap:wrap}
#topbar h1{font-size:clamp(18px,3vw,28px);color:#bbf7d0;text-shadow:0 0 16px rgba(34,197,94,.8);font-weight:900}
.btn-top{background:#14532d;border:1px solid #22c55e;color:#bbf7d0;border-radius:.6rem;padding:8px 14px;font-weight:800;cursor:pointer;font-size:12px}
a.btn-top{text-decoration:none;display:inline-flex;align-items:center}
.btn-top:hover{background:#166534}
#table-wrap{position:relative;max-width:1000px;margin:0 auto;padding:10px}
#table{position:relative;width:100%;aspect-ratio:16/10;max-height:600px;margin:8px auto;border-radius:50%/50%;background:radial-gradient(ellipse at 50% 40%,#15803d 0%,#166534 50%,#0f3d22 82%);border:14px solid #29180c;box-shadow:0 0 60px rgba(34,197,94,.4),inset 0 0 80px rgba(2,20,10,.65)}
#felt-logo{position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);font-size:clamp(14px,3vw,30px);font-weight:900;color:rgba(187,247,208,.12);letter-spacing:.35em;pointer-events:none;white-space:nowrap}
#dealer-zone{position:absolute;top:1.5%;left:50%;transform:translateX(-50%);text-align:center;z-index:4}
#dealer-zone img{width:clamp(70px,10vw,120px);border-radius:12px;border:2px solid #a855f7;box-shadow:0 0 24px rgba(168,85,247,.85);display:block;margin:0 auto}
#dealer-zone span{font-size:clamp(8px,1vw,11px);font-weight:900;color:#e9d5ff;text-shadow:0 0 8px #a855f7;letter-spacing:.1em}
.zone-label{font-size:clamp(9px,1.2vw,12px);font-weight:900;letter-spacing:.2em;color:#86efac;text-transform:uppercase;text-shadow:0 1px 3px #000}
#dealer-cards,#player-cards{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:clamp(5px,.9vw,12px)}
#dealer-cards{top:24%}
#player-cards{top:58%}
#dealer-total,#player-total{position:absolute;left:50%;transform:translateX(-50%);font-size:clamp(10px,1.4vw,14px);font-weight:900;color:#fde68a;text-shadow:0 1px 4px #000}
#dealer-total{top:47%}
#player-total{top:81%}
.card{width:clamp(44px,6.2vw,72px);aspect-ratio:2.5/3.5;border-radius:8%;background:linear-gradient(160deg,#fff,#dbe3ee);border:1px solid #94a3b8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;box-shadow:0 3px 8px rgba(0,0,0,.5);animation:dealin .35s ease-out backwards}
.card .r{font-size:clamp(16px,2.4vw,28px);line-height:1}
.card .s{font-size:clamp(13px,2vw,22px);line-height:1}
.card.red{color:#dc2626}.card.blk{color:#0f172a}
.card.back{background:repeating-linear-gradient(45deg,#16a34a 0 6px,#15803d 6px 12px);border:2px solid #86efac}
@keyframes dealin{from{transform:translateY(-26px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
#message{max-width:760px;margin:10px auto;text-align:center;font-size:clamp(13px,2vw,18px);font-weight:900;color:#fde68a;text-shadow:0 0 12px rgba(251,191,36,.5);min-height:26px}
#bet-bar{max-width:760px;margin:8px auto;background:rgba(2,20,10,.75);border:1px solid rgba(34,197,94,.4);border-radius:1rem;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.pbtn{border:none;border-radius:.7rem;padding:10px 22px;font-weight:900;font-size:14px;cursor:pointer;letter-spacing:.05em;transition:transform .08s,box-shadow .2s;color:#fff}
.pbtn:active:not(:disabled){transform:scale(.95)}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.pbtn.hit{background:linear-gradient(135deg,#16a34a,#14532d);box-shadow:0 0 14px rgba(34,197,94,.5)}
.pbtn.stand{background:linear-gradient(135deg,#d97706,#78350f);box-shadow:0 0 14px rgba(245,158,11,.5)}
.pbtn.double{background:linear-gradient(135deg,#2563eb,#1e3a8a);box-shadow:0 0 14px rgba(37,99,235,.5)}
.pbtn.deal{background:linear-gradient(135deg,#dc2626,#7f1d1d)}
.chipbtn{width:52px;height:52px;border-radius:50%;border:4px dashed rgba(255,255,255,.75);font-weight:900;font-size:13px;cursor:pointer;color:#fff;text-shadow:0 1px 2px #000;transition:transform .1s;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.chipbtn:hover{transform:scale(1.1)}
.chipbtn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.c5{background:#334155}.c10{background:#dc2626}.c25{background:#16a34a}.c50{background:#2563eb}.c100{background:#7c3aed}
#bet-display{font-weight:900;color:#86efac;font-size:16px;min-width:90px;text-align:center}
#bankroll{max-width:760px;margin:6px auto;text-align:center;font-size:14px;font-weight:800;color:#fbbf24}
#log{max-width:760px;margin:10px auto 20px;height:100px;overflow-y:auto;background:rgba(2,20,10,.6);border:1px solid rgba(34,197,94,.25);border-radius:.7rem;padding:8px 12px;font-size:12px;line-height:1.5}
#log div{border-bottom:1px dashed rgba(148,163,184,.12)}
#log .sys{color:#86efac}#log .win{color:#4ade80;font-weight:700}#log .lose{color:#f87171;font-weight:700}
#bj-rules{display:none;position:fixed;inset:0;background:rgba(2,20,10,.9);z-index:50;align-items:center;justify-content:center}
#bj-rules.open{display:flex}
#bj-rules .panel{background:#052e16;border:1px solid #22c55e;border-radius:1rem;padding:22px 28px;max-width:340px;font-size:13px;line-height:1.9;color:#cbd5e1}
#bj-rules h2{color:#86efac;font-size:18px;margin-bottom:6px}
@media(max-width:700px){#table{aspect-ratio:auto;height:66vh;border-width:8px}}
</style>
</head>
<body>

<div id="topbar">
 <h1>🃏 JOKER BLACKJACK</h1>
 <div style="display:flex;gap:8px">
  <button class="btn-top" id="btn-rules">📋 Rules</button>
  <button class="btn-top" id="btn-rebuy">🪙 Rebuy 500</button>
  <a href="index.html" class="btn-top">🏠 Main Menu</a>
 </div>
</div>

<div id="table-wrap">
 <div id="table">
  <div id="felt-logo">BLACKJACK</div>
  <div id="dealer-zone"><img id="dealer-img" alt="Dealer Joker P"></div>
  <div class="zone-label" style="position:absolute;top:19%;left:50%;transform:translateX(-50%)">Dealer</div>
  <div id="dealer-cards"></div>
  <div id="dealer-total"></div>
  <div class="zone-label" style="position:absolute;top:53%;left:50%;transform:translateX(-50%)">You</div>
  <div id="player-cards"></div>
  <div id="player-total"></div>
 </div>
</div>

<div id="message">Place your bet to begin</div>

<div id="bet-bar">
 <button class="chipbtn c5" data-v="5">5</button>
 <button class="chipbtn c10" data-v="10">10</button>
 <button class="chipbtn c25" data-v="25">25</button>
 <button class="chipbtn c50" data-v="50">50</button>
 <button class="chipbtn c100" data-v="100">100</button>
 <span id="bet-display">Bet: 0</span>
 <button class="pbtn stand" id="btn-clear">CLEAR</button>
 <button class="pbtn deal" id="btn-deal">DEAL</button>
 <button class="pbtn hit" id="btn-hit" disabled>HIT</button>
 <button class="pbtn stand" id="btn-stand" disabled>STAND</button>
 <button class="pbtn double" id="btn-double" disabled>DOUBLE</button>
</div>
<div id="bankroll">🪙 500 chips</div>
<div id="log"></div>

<div id="bj-rules">
 <div class="panel">
  <h2>Rules</h2>
  Blackjack pays <b>3:2</b> · Dealer stands on 17<br>
  Double down: double your bet, take exactly one card<br>
  Dealer (Joker P) must hit until 17<br>
  Aces count 1 or 11 · Face cards = 10
  <br><button class="btn-top" style="margin-top:12px" id="btn-close-rules">Close</button>
 </div>
</div>

let deck=[],player=[],dealer=[],bankroll=500,bet=0,hideHole=true,busy=false,doubled=false;

function newDeck(){
 const d=[];
 for(const s of SUITS)for(const r of RANKS)d.push({r,s});
 for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
 return d;
}
const val=c=>c.r==='A'?11:['K','Q','J'].includes(c.r)?10:+c.r;
function total(hand){
 let t=hand.reduce((a,c)=>a+val(c),0),aces=hand.filter(c=>c.r==='A').length;
 while(t>21&&aces>0){t-=10;aces--}
 return t;
}
const isBJ=h=>h.length===2&&total(h)===21;
function cardHTML(c,faceDown){
 if(faceDown)return'<div class="card back"></div>';
 const red=(c.s==='♥'||c.s==='♦')?'red':'blk';
 return`<div class="card ${red}"><span class="r">${c.r}</span><span class="s">${c.s}</span></div>`;
}
function render(){
 $('dealer-cards').innerHTML=dealer.map((c,i)=>cardHTML(c,hideHole&&i===1)).join('');
 $('player-cards').innerHTML=player.map(c=>cardHTML(c)).join('');
 $('dealer-total').textContent=dealer.length?(hideHole?'Showing '+val(dealer[0]):'Total '+total(dealer)):'';
 $('player-total').textContent=player.length?'Total '+total(player):'';
 $('bet-display').textContent='Bet: '+bet;
 $('bankroll').textContent='🪙 '+bankroll+' chips';
}
function log(msg,cls='sys'){const d=document.createElement('div');d.className=cls;d.innerHTML=msg;$('log').prepend(d)}
function setMsg(t){$('message').textContent=t}
function setPlaying(on){
 ['btn-hit','btn-stand','btn-double'].forEach(id=>$(id).disabled=!on);
 ['btn-deal','btn-clear'].forEach(id=>$(id).disabled=on);
 document.querySelectorAll('.chipbtn').forEach(b=>b.disabled=on);
}
const busted=h=>total(h)>21;

async function deal(){
 if(busy)return;
 if(bet<=0){setMsg('Place a bet first!');return}
 if(bet>bankroll){setMsg('Not enough chips!');return}
 busy=true;doubled=false;
 bankroll-=bet;deck=newDeck();player=[];dealer=[];hideHole=true;
 setPlaying(true);render();
 player.push(deck.pop(),deck.pop());dealer.push(deck.pop(),deck.pop());
 log('Cards dealt — bet '+bet);render();await sleep(400);
 if(isBJ(player)||isBJ(dealer)){
  hideHole=false;render();
  if(isBJ(player)&&isBJ(dealer)){push();setMsg('Double blackjack — push!');log('Both have blackjack. Push.','sys')}
  else if(isBJ(player)){bankroll+=bet+Math.floor(bet*1.5);setMsg('🃏 BLACKJACK! You win '+Math.floor(bet*1.5)+'!');log('BLACKJACK pays 3:2 — you win '+(bet+Math.floor(bet*1.5)),'win')}
  else{setMsg('Dealer has blackjack — you lose.');log('Dealer blackjack. You lose '+bet+'.','lose')}
  endRound();return;
 }
 setMsg('Hit, stand or double?');busy=false;
}
function push(){bankroll+=bet}
async function hit(){
 if(busy)return;busy=true;
 player.push(deck.pop());render();await sleep(300);
 if(busted(player)){hideHole=false;render();setMsg('Bust! You lose '+bet+'.');log('Bust at '+total(player)+'. Dealer wins.','lose');endRound();return}
 busy=false;
}
async function stand(){
 if(busy)return;busy=true;
 hideHole=false;render();
 while(total(dealer)<17){dealer.push(deck.pop());render();await sleep(550)}
 const pt=total(player),dt=total(dealer);
 if(busted(dealer)||pt>dt){const win=doubled?bet*2:bet;bankroll+=win*2;setMsg('You win '+win+'! 🎉');log(`You win ${win} (${pt} vs ${dt}).`,'win')}
 else if(pt===dt){push();setMsg('Push — bet returned.');log(`Push at ${pt}.`,'sys')}
 else{setMsg('Dealer wins '+bet+'.');log(`Dealer wins ${dt} vs ${pt}.`,'lose')}
 endRound();
}
async function dbl(){
 if(busy)return;
 if(bet>bankroll){setMsg('Not enough chips to double!');return}
 busy=true;bankroll-=bet;bet*=2;doubled=true;render();await sleep(250);
 player.push(deck.pop());render();await sleep(350);
 if(busted(player)){hideHole=false;render();setMsg('Bust! You lose '+bet+'.');log('Double down bust at '+total(player)+'.','lose');endRound();return}
 busy=false;stand();
}
function endRound(){
 setPlaying(false);busy=false;bet=0;
 if(bankroll<=0){setMsg('Out of chips! Use Rebuy.');log('Bankroll empty — hit Rebuy.','lose')}
 render();
}

document.querySelectorAll('.chipbtn').forEach(b=>b.onclick=()=>{
 if(busy)return;
 const v=+b.dataset.v;
 if(bet+v>bankroll){setMsg('Not enough chips!');return}
 bet+=v;render();
});
$('btn-clear').onclick=()=>{if(!busy){bet=0;render()}};
$('btn-deal').onclick=deal;
$('btn-hit').onclick=hit;
$('btn-stand').onclick=stand;
$('btn-double').onclick=dbl;
$('btn-rebuy').onclick=()=>{if(!busy){bankroll+=500;log('Rebought 500 chips. 🪙','sys');render()}};
$('btn-rules').onclick=()=>$('bj-rules').classList.add('open');
$('btn-close-rules').onclick=()=>$('bj-rules').classList.remove('open');
$('bj-rules').onclick=e=>{if(e.target.id==='bj-rules')$('bj-rules').classList.remove('open')};

render();
log('Welcome to <b>Joker Blackjack</b> — the Joker P deals. Blackjack pays 3:2.');
</script>
