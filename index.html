<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Culo Piscineros.PR version</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',system-ui,sans-serif;background:#081e0e;color:#fff;user-select:none;touch-action:manipulation;overflow-x:hidden}
.card{aspect-ratio:2.5/3.5;background:#fff;flex-shrink:0;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 8px rgba(0,0,0,.4);cursor:pointer;margin:0;position:relative}
.card:hover{transform:translateY(-10px)}
.card.selected{transform:translateY(-18px) scale(1.08);border:3px solid #f59e0b!important;box-shadow:0 0 25px rgba(245,158,11,.9);z-index:10}
.red{color:#dc2626}.blk{color:#111827}
.table{background:radial-gradient(circle at center,#0f4c23,#062b11);box-shadow:inset 0 0 40px rgba(0,0,0,.8);border:4px solid #10b981;display:flex;align-items:flex-end;justify-content:center;gap:.75rem;flex-wrap:nowrap;position:relative;padding:1rem;overflow:hidden}
#table-cards{display:flex;align-items:flex-end;justify-content:center;gap:.7rem;flex-wrap:nowrap;position:relative;width:100%;max-width:52rem;margin:0 auto}
#table-cards .card{margin:0}
@keyframes pop{0%{transform:scale(0) rotate(-45deg);opacity:0}50%{transform:scale(1.4) rotate(12deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.pop{animation:pop .6s cubic-bezier(.175,.885,.32,1.275) forwards}
.panel{background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.1);border-radius:1rem}
.btn{font-weight:900;border-radius:.75rem;padding:.7rem 1.2rem;font-size:.8rem;text-transform:uppercase;transition:.15s}
.btn:disabled{opacity:.35;cursor:not-allowed}
.amber{background:#f59e0b;color:#111}.amber:hover:not(:disabled){background:#fbbf24}
.gray{background:#1f2937;color:#fcd34d;border:1px solid rgba(255,255,255,.1)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:40}
.modal.hidden{display:none}
.box{background:#111827;border:2px solid rgba(245,158,11,.5);border-radius:1.5rem;padding:1.5rem;max-width:28rem;width:100%;text-align:center}
.inp{width:100%;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.2);border-radius:.75rem;padding:.7rem 1rem;color:#fcd34d;font-weight:700}
</style>
</head>
<body class="min-h-screen flex flex-col items-center p-2 md:p-4">

<!-- LOBBY -->
<div id="lobby-modal" class="modal">
 <div class="box">
  <h1 class="text-3xl font-black text-amber-400 mb-1">🃏 El Culo</h1>
  <p class="text-xs text-gray-300 mb-5 font-bold uppercase tracking-wider">Versió Piscineros PR</p>
  <label class="block text-left text-xs font-bold text-gray-400 uppercase mb-1">El teu nom</label>
  <input id="input-player-name" class="inp mb-4" maxlength="12" placeholder="Escriu el teu nom...">
  <div id="lobby-initial-actions" class="space-y-3">
   <button id="btn-show-create" class="btn amber w-full">👑 Crear Sala Nova</button>
   <div class="flex gap-2">
    <input id="input-room-code" class="inp w-1/2 text-center uppercase tracking-widest" maxlength="5" placeholder="CODI">
    <button id="btn-join-room" class="btn w-1/2 bg-emerald-600 hover:bg-emerald-500">Entrar</button>
   </div>
   <button id="btn-rules-lobby" class="btn gray w-full">📖 Regles del Joc</button>
  </div>
  <div id="lobby-room-waiting" class="hidden text-left space-y-4">
   <div class="panel p-4 flex justify-between items-center">
    <div><span class="text-[10px] font-bold text-amber-400/80 uppercase block">Codi de la sala</span>
    <span id="display-room-code" class="text-4xl font-black text-amber-400 tracking-widest">---</span></div>
